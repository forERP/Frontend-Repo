name: Frontend CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  docker-backoffice:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push on develop)
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice-web
          file: ./backoffice-web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ghcr.io/forerp/frontend-repo/backoffice-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max

  docker-store:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build (and push on develop)
        uses: docker/build-push-action@v6
        with:
          context: ./store-web
          file: ./store-web/Dockerfile
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/develop' }}
          tags: ghcr.io/forerp/frontend-repo/store-web:dev
          cache-from: type=gha
          cache-to: type=gha,mode=max