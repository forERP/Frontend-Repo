name: Frontend CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-backoffice:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backoffice-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backoffice-web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  build-store:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: store-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: store-web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build

  docker-backoffice:
    if: github.ref == 'refs/heads/develop'
    needs: build-backoffice
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backoffice image
        uses: docker/build-push-action@v6
        with:
          context: ./backoffice-web
          file: ./backoffice-web/Dockerfile
          push: true
          tags: |
            ghcr.io/forerp/frontend-repo/backoffice-web:dev

  docker-store:
    if: github.ref == 'refs/heads/develop'
    needs: build-store
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push store image
        uses: docker/build-push-action@v6
        with:
          context: ./store-web
          file: ./store-web/Dockerfile
          push: true
          tags: |
            ghcr.io/forerp/frontend-repo/store-web:dev