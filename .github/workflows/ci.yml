name: Frontend CI

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  build-backoffice:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backoffice-web

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backoffice-web/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Build
        run: npm run build