server {
    listen 80;
    server_name _;

    root   /usr/share/nginx/html;
    index  index.html;

    # Vite로 빌드된 SPA 라우팅 처리
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 정적 파일 캐싱 (필요 시 조정)
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico)$ {
        try_files $uri $uri/ /index.html;
        expires 7d;
        access_log off;
    }
}

